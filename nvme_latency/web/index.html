<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NVMe Latency</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <nav class="nav">
        <a class="nav-item" id="nav-summary" href="#/">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 12l4-4M7.5 12h1M12 7.5v1M15.5 12h1"/>
          </svg>
          <span>Summary</span>
        </a>
      </nav>
      <div class="nav-section"><span>Devices</span></div>
      <div id="device-list" class="device-list"></div>
      <div class="brand" title="nvme_latency_web">
        <svg viewBox="0 0 120 40" class="brand-pulse" aria-hidden="true">
          <polyline points="0,22 30,22 37,22 42,8 48,34 54,4 60,30 64,22 120,22"/>
        </svg>
        <div class="brand-text">NVMe<span>LAT</span></div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <h1 id="page-title">Summary</h1>
        <span id="source-badge" class="badge" hidden></span>
        <div class="spacer"></div>
        <div class="seg" id="window-seg" role="group" aria-label="Time window"></div>
        <button id="pause-btn" class="btn" title="Pause / resume live updates (space)">Pause</button>
      </header>
      <section id="content"></section>
      <footer id="statusbar">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Connecting…</span>
        <span class="spacer"></span>
        <span id="status-host" class="muted"></span>
        <span id="status-live" class="pill">LIVE</span>
        <span id="status-clock" class="lcd">00:00:00</span>
      </footer>
    </main>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
